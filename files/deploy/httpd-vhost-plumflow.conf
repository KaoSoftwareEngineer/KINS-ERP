# ============================================================================
#  Apache VirtualHost สำหรับ KINS ERP (plumflowsolution.com)
#
#  หน้าที่ 2 อย่าง:
#   1) เสิร์ฟหน้าเว็บที่ build แล้ว (frontend/dist) เป็นไฟล์ static
#   2) ส่งต่อ /api และ /uploads ไปให้ Node (พอร์ต 3000) — ที่ dev เคยใช้ vite proxy ทำให้
#      พอ build เป็น production แล้ว vite ไม่อยู่ ต้องให้ Apache ทำหน้าที่นี้แทน
#      ถ้าไม่มีส่วนนี้ หน้าเว็บจะเรียก API ไม่เจอทั้งระบบ
#
#  ติดตั้ง: เพิ่มบรรทัดนี้ท้าย C:\xampp\apache\conf\extra\httpd-vhosts.conf
#     Include "C:/xampp/htdocs/KINS/files/deploy/httpd-vhost-plumflow.conf"
#  แล้วรีสตาร์ท Apache
#
#  ต้องเปิดโมดูลใน httpd.conf ก่อน (เอา # ข้างหน้าออก):
#     LoadModule proxy_module      modules/mod_proxy.so
#     LoadModule proxy_http_module modules/mod_proxy_http.so
#     LoadModule rewrite_module    modules/mod_rewrite.so
# ============================================================================

# ---- vhost ตัวแรก = ค่า default ของพอร์ต 80 ----
# วางไว้ก่อนเพื่อให้ http://localhost ยังเปิด XAMPP dashboard ได้เหมือนเดิม
# (ถ้าไม่มีตัวนี้ vhost ของ plumflow จะกลายเป็น default แล้ว localhost จะเด้งเข้า ERP แทน)
<VirtualHost *:80>
    ServerName localhost
    DocumentRoot "C:/xampp/htdocs"
</VirtualHost>

<VirtualHost *:80>
    ServerName   plumflowsolution.com
    ServerAlias  www.plumflowsolution.com

    # หน้าเว็บที่ build แล้ว (สร้างด้วย: cd frontend && npm run build)
    DocumentRoot "C:/xampp/htdocs/KINS/frontend/dist"

    <Directory "C:/xampp/htdocs/KINS/frontend/dist">
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted

        # ---- SPA fallback ----
        # vue-router ใช้ createWebHistory() = URL สวยแบบ /dashboard ไม่มี #
        # ถ้าผู้ใช้กด F5 ที่ /dashboard Apache จะหาไฟล์ชื่อ dashboard ไม่เจอ → 404
        # กฎนี้บอกว่า: ถ้าไม่ใช่ไฟล์/โฟลเดอร์จริง ให้ส่ง index.html ไปให้ vue-router จัดการเอง
        RewriteEngine On
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^ index.html [L]
    </Directory>

    # ---- ส่งต่อไป backend Node ----
    # ProxyPreserveHost = ส่ง Host เดิมไปด้วย (Node จะเห็นโดเมนจริง ไม่ใช่ 127.0.0.1)
    ProxyPreserveHost On
    ProxyPass         /api     http://127.0.0.1:3000/api
    ProxyPassReverse  /api     http://127.0.0.1:3000/api
    ProxyPass         /uploads http://127.0.0.1:3000/uploads
    ProxyPassReverse  /uploads http://127.0.0.1:3000/uploads

    # ห้าม Apache แตะโฟลเดอร์ซอร์ส/ความลับ (กันพลาดซ้ำอีกชั้น — ดู .htaccess ที่รากโปรเจกต์)
    <DirectoryMatch "C:/xampp/htdocs/KINS/(files|database|node_modules|\.git)">
        Require all denied
    </DirectoryMatch>

    ErrorLog  "logs/plumflow-error.log"
    CustomLog "logs/plumflow-access.log" combined
</VirtualHost>
