<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>เข้าสู่ระบบ — เวอร์ชัน HTML</title>
<style>
  /* ===================== ธีมสี (โทนน้ำเงิน) ===================== */
  :root {
    --brand:        #3b5bfe;
    --brand-2:      #2537c9;
    --brand-soft:   #eaefff;
    --page:         #eef1f8;
    --surface:      #ffffff;
    --panel-grad:   linear-gradient(150deg, #4c6bff 0%, #2537c9 100%);
    --text:         #1c2333;
    --muted:        #8a93a6;
    --field:        #f4f6fb;
    --field-border: #e2e7f1;
    --shadow:       0 24px 60px rgba(37, 55, 201, .18);
    --danger:       #e5484d;
    --ok:           #17a06a;
  }
  html[data-theme="dark"] {
    --brand:        #6b83ff;
    --brand-2:      #3b5bfe;
    --brand-soft:   #1c2748;
    --page:         #0d1220;
    --surface:      #161d31;
    --panel-grad:   linear-gradient(150deg, #2a3fd6 0%, #14205e 100%);
    --text:         #e8ecf6;
    --muted:        #8b95ac;
    --field:        #1f2740;
    --field-border: #2c3654;
    --shadow:       0 24px 60px rgba(0, 0, 0, .5);
    --danger:       #ff6b6f;
    --ok:           #35c98a;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Segoe UI", Tahoma, system-ui, -apple-system, sans-serif;
    background: var(--page);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    transition: background .35s ease, color .35s ease;
  }

  /* ===================== ปุ่มสลับกลางวัน/กลางคืน ===================== */
  .theme-toggle {
    position: fixed;
    top: 20px;
    right: 20px;
    width: 40px;
    height: 40px;
    border-radius: 8px;
    border: 1px solid var(--field-border);
    background: var(--surface);
    color: var(--muted);
    cursor: pointer;
    display: grid;
    place-items: center;
    transition: background .2s ease, color .2s ease, border-color .2s ease;
    z-index: 50;
  }
  .theme-toggle:hover { background: var(--field); color: var(--text); border-color: var(--muted); }
  .theme-toggle svg { width: 19px; height: 19px; display: block; }
  .theme-toggle .icon-sun { display: none; }
  html[data-theme="dark"] .theme-toggle .icon-moon { display: none; }
  html[data-theme="dark"] .theme-toggle .icon-sun { display: block; }

  /* ===================== การ์ดล็อกอิน ===================== */
  .card {
    width: 100%;
    max-width: 820px;
    min-height: 460px;
    background: var(--surface);
    border-radius: 22px;
    box-shadow: var(--shadow);
    overflow: hidden;
    display: grid;
    grid-template-columns: 1fr 1.15fr;
    transition: background .35s ease;
  }

  /* แผงต้อนรับด้านซ้าย */
  .welcome {
    background: var(--panel-grad);
    color: #fff;
    padding: 48px 38px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    gap: 16px;
  }
  .welcome h1 { font-size: 34px; font-weight: 700; letter-spacing: .5px; }
  .welcome p { font-size: 14px; line-height: 1.6; opacity: .92; max-width: 240px; }
  .ghost-btn {
    margin-top: 10px;
    padding: 11px 34px;
    border: 1.5px solid rgba(255,255,255,.85);
    background: transparent;
    color: #fff;
    border-radius: 24px;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 1.5px;
    cursor: pointer;
    transition: background .2s, color .2s;
  }
  .ghost-btn:hover { background: #fff; color: var(--brand-2); }

  /* ฟอร์มด้านขวา */
  .form-side { padding: 46px 46px; display: flex; flex-direction: column; justify-content: center; }
  .form-side h2 { font-size: 30px; font-weight: 700; color: var(--brand-2); margin-bottom: 26px; }
  html[data-theme="dark"] .form-side h2 { color: var(--brand); }

  .field {
    width: 100%;
    padding: 13px 16px;
    margin-bottom: 14px;
    background: var(--field);
    border: 1px solid var(--field-border);
    border-radius: 10px;
    font-size: 14px;
    color: var(--text);
    transition: border .2s, box-shadow .2s;
  }
  .field::placeholder { color: var(--muted); }
  .field:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); }

  .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 12.5px;
    color: var(--muted);
    margin: 4px 2px 22px;
  }
  .row label { display: flex; align-items: center; gap: 6px; cursor: pointer; }
  .row a { color: var(--brand); text-decoration: none; }
  .row a:hover { text-decoration: underline; }

  .primary-btn {
    align-self: flex-start;
    padding: 12px 40px;
    background: var(--brand);
    color: #fff;
    border: none;
    border-radius: 24px;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 1px;
    cursor: pointer;
    transition: background .2s, transform .1s;
  }
  .primary-btn:hover { background: var(--brand-2); }
  .primary-btn:active { transform: translateY(1px); }
  .primary-btn:disabled { opacity: .6; cursor: not-allowed; }

  .msg { font-size: 13px; margin-bottom: 14px; min-height: 18px; }
  .msg.error { color: var(--danger); }
  .msg.success { color: var(--ok); }

  .switch-hint { margin-top: 18px; font-size: 13px; color: var(--muted); }
  .switch-hint a { color: var(--brand); font-weight: 600; text-decoration: none; cursor: pointer; }

  .hidden { display: none !important; }

  /* ===================== หน้าแดชบอร์ด ===================== */
  .dash {
    width: 100%;
    max-width: 960px;
    background: var(--surface);
    border-radius: 22px;
    box-shadow: var(--shadow);
    overflow: hidden;
  }
  .dash-top {
    background: var(--panel-grad);
    color: #fff;
    padding: 26px 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .dash-top h2 { font-size: 22px; }
  .dash-top .who { font-size: 13px; opacity: .9; margin-top: 4px; }
  .logout-btn {
    padding: 9px 22px;
    border: 1.5px solid rgba(255,255,255,.8);
    background: transparent;
    color: #fff;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: background .2s, color .2s;
  }
  .logout-btn:hover { background: #fff; color: var(--brand-2); }
  .dash-body { padding: 28px 32px; }
  .stat {
    display: inline-flex; flex-direction: column;
    background: var(--brand-soft); color: var(--brand-2);
    border-radius: 14px; padding: 16px 26px; margin-bottom: 22px;
  }
  html[data-theme="dark"] .stat { color: var(--text); }
  .stat b { font-size: 30px; }
  .stat span { font-size: 12.5px; opacity: .85; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 12px 14px; border-bottom: 1px solid var(--field-border); }
  th { color: var(--muted); font-weight: 600; font-size: 12.5px; text-transform: uppercase; letter-spacing: .5px; }

  @media (max-width: 720px) {
    .card { grid-template-columns: 1fr; max-width: 420px; }
    .welcome { padding: 36px 28px; }
    .form-side { padding: 34px 28px; }
  }
</style>
</head>
<body>
  <button class="theme-toggle" id="themeToggle" title="สลับโหมดกลางวัน/กลางคืน" aria-label="สลับโหมดกลางวัน/กลางคืน">
    <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
  </button>

  <!-- ============ การ์ด LOGIN / REGISTER ============ -->
  <div class="card" id="authCard">
    <!-- แผงต้อนรับ -->
    <aside class="welcome">
      <h1 id="welcomeTitle">Welcome</h1>
      <p id="welcomeText">Join Our Unique Platform, Explore a New Experience</p>
      <button class="ghost-btn" id="switchBtn">REGISTER</button>
    </aside>

    <!-- ฟอร์ม -->
    <section class="form-side">
      <!-- ฟอร์มเข้าสู่ระบบ -->
      <form id="loginForm">
        <h2>Sign In</h2>
        <div class="msg" id="loginMsg"></div>
        <input class="field" type="email" id="loginEmail" placeholder="Email" autocomplete="username" required />
        <input class="field" type="password" id="loginPassword" placeholder="Password" autocomplete="current-password" required />
        <div class="row">
          <label><input type="checkbox" id="remember" /> Remember me</label>
          <a href="#" onclick="return false">Forgot password?</a>
        </div>
        <button class="primary-btn" type="submit">LOGIN</button>
        <div class="switch-hint">ยังไม่มีบัญชี? <a id="toRegister">สมัครสมาชิก</a></div>
      </form>

      <!-- ฟอร์มสมัครสมาชิก -->
      <form id="registerForm" class="hidden">
        <h2>Create Account</h2>
        <div class="msg" id="regMsg"></div>
        <input class="field" type="text" id="regName" placeholder="ชื่อ (Name)" autocomplete="name" />
        <input class="field" type="email" id="regEmail" placeholder="Email" autocomplete="email" required />
        <input class="field" type="password" id="regPassword" placeholder="Password (อย่างน้อย 6 ตัว)" autocomplete="new-password" required />
        <button class="primary-btn" type="submit" style="margin-top:6px">REGISTER</button>
        <div class="switch-hint">มีบัญชีอยู่แล้ว? <a id="toLogin">เข้าสู่ระบบ</a></div>
      </form>
    </section>
  </div>

  <!-- ============ หน้าแดชบอร์ด (แสดงหลังล็อกอิน) ============ -->
  <div class="dash hidden" id="dashboard">
    <div class="dash-top">
      <div>
        <h2>แดชบอร์ด (Dashboard)</h2>
        <div class="who" id="dashWho"></div>
      </div>
      <button class="logout-btn" id="logoutBtn">ออกจากระบบ</button>
    </div>
    <div class="dash-body">
      <div class="stat"><b id="memberCount">0</b><span>สมาชิกทั้งหมด</span></div>
      <h3 style="margin-bottom:12px;font-size:16px;">รายชื่อสมาชิกที่สมัครไว้</h3>
      <table>
        <thead>
          <tr><th>#</th><th>ชื่อ</th><th>อีเมล</th><th>สมัครเมื่อ</th></tr>
        </thead>
        <tbody id="memberRows"></tbody>
      </table>
    </div>
  </div>

<script>
  // ถ้าเปิดไฟล์แบบ file:// ให้ยิงไปที่เซิร์ฟเวอร์ localhost:3000
  const API = location.protocol === 'file:' ? 'http://localhost:3000' : '';

  const $ = (id) => document.getElementById(id);
  let token = null;

  // ---------- โหมดกลางวัน/กลางคืน ----------
  const savedTheme = localStorage.getItem('theme') || 'light';
  document.documentElement.setAttribute('data-theme', savedTheme);
  $('themeToggle').onclick = () => {
    const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    localStorage.setItem('theme', next);
  };

  // ---------- สลับระหว่างฟอร์ม Login / Register ----------
  function showLogin() {
    $('loginForm').classList.remove('hidden');
    $('registerForm').classList.add('hidden');
    $('welcomeTitle').textContent = 'Welcome';
    $('welcomeText').textContent = 'Join Our Unique Platform, Explore a New Experience';
    $('switchBtn').textContent = 'REGISTER';
  }
  function showRegister() {
    $('registerForm').classList.remove('hidden');
    $('loginForm').classList.add('hidden');
    $('welcomeTitle').textContent = 'Hello!';
    $('welcomeText').textContent = 'สมัครสมาชิกเพื่อเริ่มต้นใช้งานแพลตฟอร์มของเรา';
    $('switchBtn').textContent = 'LOGIN';
  }
  $('switchBtn').onclick = () =>
    $('loginForm').classList.contains('hidden') ? showLogin() : showRegister();
  $('toRegister').onclick = showRegister;
  $('toLogin').onclick = showLogin;

  // ---------- สมัครสมาชิก ----------
  $('registerForm').onsubmit = async (e) => {
    e.preventDefault();
    const msg = $('regMsg');
    msg.className = 'msg';
    msg.textContent = 'กำลังสมัคร...';
    try {
      const res = await fetch(API + '/api/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          name: $('regName').value,
          email: $('regEmail').value,
          password: $('regPassword').value,
        }),
      });
      const data = await res.json();
      if (data.ok) {
        msg.className = 'msg success';
        msg.textContent = '✅ ' + data.message + ' — กำลังพาไปหน้าเข้าสู่ระบบ...';
        setTimeout(() => {
          $('loginEmail').value = $('regEmail').value;
          $('registerForm').reset();
          showLogin();
          $('loginMsg').className = 'msg success';
          $('loginMsg').textContent = 'สมัครเรียบร้อย เข้าสู่ระบบได้เลย';
        }, 1200);
      } else {
        msg.className = 'msg error';
        msg.textContent = '⚠️ ' + data.message;
      }
    } catch (err) {
      msg.className = 'msg error';
      msg.textContent = 'เชื่อมต่อเซิร์ฟเวอร์ไม่ได้ — รัน npm start ก่อนนะ';
    }
  };

  // ---------- เข้าสู่ระบบ ----------
  $('loginForm').onsubmit = async (e) => {
    e.preventDefault();
    const msg = $('loginMsg');
    msg.className = 'msg';
    msg.textContent = 'กำลังเข้าสู่ระบบ...';
    try {
      const res = await fetch(API + '/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          email: $('loginEmail').value,
          password: $('loginPassword').value,
        }),
      });
      const data = await res.json();
      if (data.ok) {
        token = data.token;
        openDashboard(data.user);
      } else {
        msg.className = 'msg error';
        msg.textContent = '⚠️ ' + data.message;
      }
    } catch (err) {
      msg.className = 'msg error';
      msg.textContent = 'เชื่อมต่อเซิร์ฟเวอร์ไม่ได้ — รัน npm start ก่อนนะ';
    }
  };

  // ---------- แดชบอร์ด ----------
  async function openDashboard(user) {
    $('authCard').classList.add('hidden');
    $('dashboard').classList.remove('hidden');
    $('dashWho').textContent = 'สวัสดี ' + (user.name || user.email) + ' 👋';
    try {
      const res = await fetch(API + '/api/users', {
        headers: { Authorization: 'Bearer ' + token },
      });
      const data = await res.json();
      $('memberCount').textContent = data.total;
      $('memberRows').innerHTML = data.users
        .map((u) => `<tr><td>${u.id}</td><td>${u.name || '-'}</td><td>${u.email}</td><td>${u.created_at || ''}</td></tr>`)
        .join('');
    } catch (err) {
      $('memberRows').innerHTML = '<tr><td colspan="4">โหลดรายชื่อไม่ได้</td></tr>';
    }
  }

  $('logoutBtn').onclick = async () => {
    try { await fetch(API + '/api/logout', { method: 'POST', headers: { Authorization: 'Bearer ' + token } }); } catch (e) {}
    token = null;
    $('dashboard').classList.add('hidden');
    $('authCard').classList.remove('hidden');
    $('loginForm').reset();
    showLogin();
  };
</script>
</body>
</html>
